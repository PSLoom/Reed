name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
permissions:
  contents: read
  packages: read
env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUILD_VERSION: ${{ inputs.version || format('0.0.0-local.{0}.{1}', github.run_id, github.run_attempt) }}
jobs:
  title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ($env:PR_TITLE -cnotmatch '^(feat|fix|perf|docs|test|ci|build|chore|style|refactor|revert)(\([^)]+\))?!?: .+') {
            throw 'Use a Conventional Commit title; include ! for an incompatible change.'
          }
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pin PowerShell
        shell: pwsh
        run: ./.github/scripts/Install-PowerShell.ps1
      - name: Environment and release regression tests
        shell: pwsh
        run: |
          $PSVersionTable
          dotnet --info
          ./.github/scripts/Test-Release.ps1
          ./.github/scripts/Test-ReleaseHistory.ps1
          pwsh -NoProfile -File .github/scripts/Test-Publication.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File .github/scripts/Test-ReleasePullRequests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File .github/scripts/Test-BudgetReporting.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet build PSLoom.Reed.slnx -c Release "-p:VersionOverride=$env:BUILD_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        shell: pwsh
        run: |
          dotnet test --solution PSLoom.Reed.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Startup measurements
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/measurements | Out-Null
          ./benchmarks/Measure-Startup.ps1 -DraftPath ./benchmarks/drafts/typical.ps1 -ReportOnly *>&1 | Tee-Object artifacts/measurements/startup.txt
          ./benchmarks/Measure-Startup.ps1 -DraftPath ./benchmarks/drafts/eager.ps1 -ReportOnly *>&1 | Tee-Object artifacts/measurements/eager.txt
      - name: Verify packed Reed
        shell: pwsh
        run: |
          dotnet pack src/PSLoom.Reed/PSLoom.Reed.csproj -c Release -o artifacts/packages "-p:VersionOverride=$env:BUILD_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/New-ReleaseAssets.ps1 -Version $env:BUILD_VERSION

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements-${{ matrix.os }}
          path: artifacts/measurements
  benchmarks:
    name: benchmark reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pin PowerShell
        shell: pwsh
        run: ./.github/scripts/Install-PowerShell.ps1
      - name: Run benchmarks
        shell: pwsh
        run: |
          dotnet run -c Release --project benchmarks/PSLoom.Reed.Benchmarks -- --filter '*CompletionBenchmarks*' --exporters json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate measurements
        shell: pwsh
        run: ./benchmarks/Assert-Budgets.ps1 -ReportOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results
