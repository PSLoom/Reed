name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for versioning

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PSLoom.Reed.slnx

      - name: Build
        run: dotnet build PSLoom.Reed.slnx --configuration Release --no-restore

      # Includes the published-module integration tests, which start real pwsh processes against artifacts/modules.
      - name: Test
        run: dotnet test --solution PSLoom.Reed.slnx --configuration Release --no-build

      # Import < 50 ms and the typical draft < 150 ms, medians of cold processes (section 6 of the design).
      - name: Startup budgets
        shell: pwsh
        run: ./benchmarks/Measure-Startup.ps1 -DraftPath ./benchmarks/drafts/typical.ps1

      # The same profile with nothing staged, reported next to the gated one: the difference is what Shed buys.
      - name: Eager draft (report only)
        shell: pwsh
        run: ./benchmarks/Measure-Startup.ps1 -DraftPath ./benchmarks/drafts/eager.ps1 -ReportOnly

  benchmarks:
    # One OS only: shared runners are noisy and BenchmarkDotNet is slow; the budgets are orders of magnitude apart from noise.
    name: benchmark budgets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run budgeted benchmarks
        run: >-
          dotnet run --configuration Release --project benchmarks/PSLoom.Reed.Benchmarks --
          --filter '*CompletionBenchmarks*'
          --exporters json

      - name: Check budgets
        shell: pwsh
        run: ./benchmarks/Assert-Budgets.ps1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results
