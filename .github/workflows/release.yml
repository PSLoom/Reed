name: Release
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without tags, publication or PR changes
        type: boolean
        default: true
      resume_tag:
        description: Existing release tag to recover using its preserved artifacts
        type: string
        default: ''
permissions:
  contents: read
  packages: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      channel: ${{ steps.plan.outputs.channel }}
      resume: ${{ steps.plan.outputs.resume }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pin PowerShell
        shell: pwsh
        run: ./.github/scripts/Install-PowerShell.ps1
      - name: Compute release
        id: plan
        shell: pwsh
        env:
          CHANNEL: ${{ github.ref_name }}
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: ./.github/scripts/Get-ReleasePlan.ps1 -Channel $env:CHANNEL -ResumeTag $env:RESUME_TAG
  verify:
    needs: plan
    if: needs.plan.outputs.resume != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.plan.outputs.version }}
  pack:
    needs: [plan, verify]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.resume != 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pin PowerShell
        shell: pwsh
        run: ./.github/scripts/Install-PowerShell.ps1
      - name: Pack final version
        shell: pwsh
        run: |
          dotnet pack src/PSLoom.Reed/PSLoom.Reed.csproj -c Release -o artifacts/packages "-p:VersionOverride=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/New-ReleaseAssets.ps1 -Version $env:RELEASE_VERSION
          ./.github/scripts/New-ReleaseManifest.ps1 -Version $env:RELEASE_VERSION -Sha $env:RELEASE_SHA -Repository $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/release/*
          if-no-files-found: error
  validate:
    needs: [plan, pack]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pin PowerShell
        shell: pwsh
        run: ./.github/scripts/Install-PowerShell.ps1
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/release
      - name: Test final packages
        shell: pwsh
        run: |
          dotnet build PSLoom.Reed.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/Test-PackedModule.ps1
  publish:
    needs: [plan, verify, pack, validate]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' &&
      vars.RELEASE_ENABLED == 'true' && inputs.dry_run != true &&
      (needs.plan.outputs.resume == 'true' || (needs.verify.result == 'success' && needs.validate.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pin PowerShell
        shell: pwsh
        run: ./.github/scripts/Install-PowerShell.ps1
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.resume != 'true'
        with:
          name: release-assets
          path: artifacts/release
      - name: Publish or resume verified assets
        shell: pwsh
        env:
          RESUME: ${{ needs.plan.outputs.resume }}
        run: |
          $parameters = @{ Repository = $env:GITHUB_REPOSITORY }
          if ($env:RESUME -eq 'true') { $parameters.ResumeTag = $env:RELEASE_TAG }
          ./.github/scripts/Publish-Release.ps1 @parameters

  follow-up:
    needs: [plan, publish]
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/release-prs.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      channel: ${{ needs.plan.outputs.channel }}
    secrets: inherit
